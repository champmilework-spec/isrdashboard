<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPERPART</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Kanit",Arial,sans-serif;
}
body{
  background:#ffffff;
  color:#111;
  overflow-x:hidden;
}
.bg{
  position:fixed;
  width:700px;
  height:700px;
  background:radial-gradient(circle,rgba(0,0,0,0.04),transparent 70%);
  top:-250px;
  right:-250px;
  z-index:-1;
}
.hero{
  min-height:75vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:120px 20px 60px;
}
.brand-logo-wrap{
  margin-bottom:20px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.brand-logo-img{
  max-width:240px;
  height:auto;
  object-fit:contain;
}
.tag{
  font-size:12px;
  letter-spacing:3px;
  color:#666;
  margin-top:10px;
}
.sub{
  max-width:720px;
  font-size:18px;
  color:#555;
  line-height:1.8;
  margin-top:20px;
}
.hero-action{
  margin-top:35px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  width:100%;
  max-width:500px;
}
.hero-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 22px;
  border-radius:999px;
  background:#111;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:500;
  letter-spacing:1px;
  border:1px solid #111;
  transition:0.25s;
}
.hero-btn:hover{
  background:#fff;
  color:#111;
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,0,0,0.05);
}
.hero-btn-blue{
  background:#2f5ea8;
  border-color:#2f5ea8;
}
.hero-btn-blue:hover{
  background:#fff;
  color:#2f5ea8;
  border-color:#2f5ea8;
}
.hero-btn-white{
  background:#ffffff;
  color:#111;
  border-color:#ddd;
}
.hero-btn-white:hover{
  background:#111;
  color:#fff;
  border-color:#111;
}
.remark-warning{
  font-size:11px;
  color:#ef4444;
  margin-top:18px;
  font-weight:500;
  letter-spacing:0.5px;
  background:#fff5f5;
  border:1px solid #fee2e2;
  padding:6px 16px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow:0 2px 5px rgba(239,68,68,0.03);
}
.section{
  padding:60px 20px;
}
.title{
  text-align:center;
  font-size:24px;
  margin-bottom:30px;
  letter-spacing:2px;
}
.textblock{
  max-width:720px;
  margin:0 auto;
  line-height:1.8;
  color:#444;
}
.brands{
  max-width:900px;
  margin:0 auto;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
}
.brandtag{
  font-size:12px;
  border:1px solid #ddd;
  padding:6px 12px;
  border-radius:999px;
  color:#111;
  text-decoration:none;
  display:inline-block;
}
a.brandtag:hover{
  background:#111;
  color:#fff;
  border-color:#111;
  transform:translateY(-1px);
  transition:0.2s;
}
.contact{
  padding:60px 20px;
  text-align:center;
}
.fallback-footer{
  background:#111;
  color:#777;
  text-align:center;
  padding:30px 20px;
  font-size:13px;
  border-top:1px solid #222;
}
@media(max-width:768px){
  .hero{
    padding:140px 20px 60px;
  }
  .brand-logo-img{
    max-width:190px;
  }
  .sub{
    font-size:15px;
    padding:0 10px;
  }
  .hero-action{
    max-width:100%;
    padding:0 10px;
    gap:10px;
  }
  .hero-btn{
    padding:12px 10px;
    font-size:11px;
    letter-spacing:0.5px;
  }
  .remark-warning{
    font-size:10px;
    padding:4px 12px;
  }
}
</style>
</head>
<body>
<div class="bg"></div>
<div id="header-placeholder"></div>
<section class="hero">
<div class="brand-logo-wrap">
<img src="https://res.cloudinary.com/dqtbgfk73/image/upload/v1779160379/Asset_1_kayj8w.png" alt="SUPERPART Logo" class="brand-logo-img">
</div>
<div class="tag">AUTOMOTIVE COATING &amp; PARTS SYSTEM</div>
<div class="sub">ศูนย์รวมสีพ่นรถยนต์และชิ้นส่วนอะไหล่คุณภาพสูง คัดสรรเพื่อประสิทธิภาพและความทนทานสูงสุดสำหรับยานยนต์คุณ</div>
<div class="hero-action">
<a class="hero-btn" href="cases.html">CASES</a>
<a class="hero-btn hero-btn-blue" href="inventory.html">INVENTORY</a>
<a class="hero-btn hero-btn-white" href="sales.html">SALES DASHBOARD</a>
<a class="hero-btn hero-btn-white" href="promo.html">PROMOTIONS</a>
<a class="hero-btn hero-btn-white" href="products.html">CATALOG</a>
</div>
</section>
<section class="section">
<div class="title">OUR BRANDS</div>
<div class="brands">
<div class="brandtag">CROMAX</div>
<div class="brandtag">NIPPON PAINT</div>
<a class="brandtag" href="domac.html">DOMAC</a>
<div class="brandtag">3M</div>
<div class="brandtag">LEZZON</div>
<div class="brandtag">SOLAR</div>
</div>
</section>
<section class="contact">
<div class="title">CONTACT</div>
<p>Email: supalerk.k@superpart.co.th</p>
</section>
<div id="footer-placeholder"></div>
<script src="layout.js"></script>
</body>
</html>
