<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคลังสินค้า</title>

  <!-- 🟢 Fast Auto-Login Pre-Check Script: ตรวจสอบ Token ล่วงหน้าเพื่อซ่อน Lock Screen ทันที -->
  <script>
    (function() {
      const token = localStorage.getItem("app_auth_token");
      const expiry = localStorage.getItem("app_auth_token_expiry");
      if (token && expiry && Date.now() < parseInt(expiry, 10)) {
        document.documentElement.classList.add("is-authenticated");
      }
    })();
  </script>

  <style>
    /* Base Styles */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }

    /* Lock Screen & Fast Cache States */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e1e2d;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* เมื่อมี Cache Valid ให้ซ่อน Lock Screen และแสดง Main Area ทันที */
    html.is-authenticated #lock-screen {
      display: none !important;
    }

    html.is-authenticated #main-content-area {
      display: block !important;
    }

    .lock-box {
      background: #2b2b40;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-sizing: border-box;
    }

    .lock-box.brutal-danger {
      border: 2px solid #ef4444;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .lock-title {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .lock-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1e1e2d;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }

    .lock-btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .lock-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .lock-msg {
      margin-top: 15px;
      font-size: 14px;
      word-wrap: break-word;
    }

    /* Main Layout */
    #main-content-area {
      display: none;
      padding: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .search-group {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 280px;
    }

    .search-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .select-control {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }

    .btn-sync {
      padding: 10px 15px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Chip Filters */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .chip {
      padding: 6px 12px;
      background: #e5e7eb;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .chip.active {
      background: #2563eb;
      color: white;
    }

    .chip input[type="checkbox"] {
      display: none;
    }

    /* Data Table */
    .meta-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }

    .table-container {
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f8fafc;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      background: #f1f5f9;
    }

    tr:hover {
      background-color: #f8fafc;
      cursor: pointer;
    }

    .col-barcode { width: 20%; }
    .col-desc { width: 55%; }
    .col-dynamic { width: 25%; text-align: right; }
    th.col-dynamic { text-align: right; }

    .sort-arrow {
      font-size: 12px;
      margin-left: 4px;
      color: #888;
    }

    /* Toast & Navigation */
    #copyToast {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    #toTop {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #3b82f6;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .status-loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>
<body>

  <!-- Lock Screen -->
  <div id="lock-screen">
    <div class="lock-box">
      <div class="lock-title">🔐 กรุณายืนยันตัวตนเข้าสู่ระบบ</div>
      <input type="password" id="passInput" class="lock-input" placeholder="ใส่รหัสผ่านเข้าใช้งาน...">
      <button id="submitBtn" class="lock-btn">เข้าสู่ระบบ</button>
      <div id="lock-msg" class="lock-msg"></div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div id="main-content-area">
    <div class="top-bar">
      <div class="search-group">
        <input type="text" id="searchBox" class="search-input" placeholder="🔍 ค้นหา รหัสสินค้า, ชื่อ, บาร์โค้ด...">
        <select id="columnSelector" class="select-control">
          <option value="onhand">จำนวนคงเหลือ (Onhand)</option>
          <option value="onhand_cost">มูลค่าคงเหลือ (Cost)</option>
          <option value="stockstatus">สถานะสินค้า (Status)</option>
          <option value="glocat">โลเคชั่น (Location)</option>
        </select>
      </div>

      <select id="brandSelector" class="select-control">
        <option value="ALL">แบรนด์ทั้งหมด</option>
        <option value="CROMAX">CROMAX / NASON</option>
        <option value="DUXONE">DUXONE</option>
        <option value="STANDOX">STANDOX</option>
      </select>

      <label class="checkbox-label">
        <input type="checkbox" id="hideZero"> ซ่อนยอดเป็น 0 / ว่าง
      </label>

      <button id="syncBtn" class="btn-sync">🔄 Sync ข้อมูล</button>
      <span id="syncProgress"></span>
    </div>

    <!-- Category Filter Chips -->
    <div id="cat-chips-container" class="chip-group"></div>

    <!-- Division Filter Chips -->
    <div id="div-chips-container" class="chip-group"></div>

    <!-- Data Table & Meta -->
    <div class="meta-info">
      <span id="result-count">0 items</span>
      <span id="inventory-cost-sum">Value: 0.00</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th id="th-gbarcode" class="col-barcode">
              บาร์โค้ด <span class="sort-arrow" id="arrow-gbarcode">↕</span>
            </th>
            <th id="th-name" class="col-desc">
              ชื่อรายการสินค้า <span class="sort-arrow" id="arrow-name">↕</span>
            </th>
            <th id="th-dynamic" class="col-dynamic">
              <span id="dynamic-th-label">จำนวนคงเหลือ (Onhand) <span class="sort-arrow" id="arrow-dynamic">↕</span></span>
            </th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td colspan="3" class="status-loading">กำลังตรวจสอบฐานข้อมูลแคชความเร็วสูง...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- UI Floating Controls -->
  <div id="copyToast">📋 คัดลอกข้อมูลเรียบร้อยแล้ว</div>
  <button id="toTop">↑</button>

  <!-- External Script -->
  <script src="cm.js"></script>
</body>
</html>
