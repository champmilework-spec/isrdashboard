<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM System</title>
    
    <!-- CSS สไตล์ทั้งหมดรวมไว้อยู่ในนี้นะครับ -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #1a252f;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e1e8ed;
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        /* Styling สำหรับ Chip Elements */
        .chip {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .chip-success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .chip-warning {
            background-color: #fef3c7;
            color: #92400e;
        }

        .chip-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .chip-default {
            background-color: #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>รายการข้อมูล (CM System)</h1>
        
        <div class="table-wrapper">
            <table id="cmTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>รายการ</th>
                        <th>สถานะ</th>
                        <th>การดำเนินการ</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- โค้ด JavaScript จะมาสร้างแถวข้อมูลใส่ตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- เชื่อมต่อไฟล์ JavaScript ออกไปข้างนอก -->
    <!-- แนะนำให้สร้างไฟล์ชื่อ main.js หรือ script.js แล้วนำไปวางไว้โฟลเดอร์เดียวกัน -->
    <script src="script.js"></script>

</body>
</html>
